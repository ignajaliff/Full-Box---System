server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # El sistema es una SPA con React Router: /productos, /remitos, etc. no son
  # archivos en disco. Sin este fallback, entrar directo a una URL o recargar
  # la página devuelve 404.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Los assets llevan hash en el nombre: cachearlos fuerte es seguro.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html NUNCA se cachea: es lo que apunta a los assets nuevos después
  # de cada deploy. Si se cachea, el usuario sigue viendo la versión vieja.
  # Los headers de seguridad se repiten porque en nginx un add_header dentro
  # de un location descarta los heredados del bloque server.
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  # Endpoint liviano para el health check de CapRover.
  location = /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
